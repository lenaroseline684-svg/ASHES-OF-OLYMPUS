<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ashes of Olympus — V25</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050608;
  color:#fff;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.top{
  position:absolute;
  top:14px;
  left:16px;
  right:16px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.panel{
  background:rgba(5,7,10,.62);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:10px 13px;
  backdrop-filter:blur(8px);
}

.name{
  font-weight:800;
  letter-spacing:2px;
  font-size:12px;
  color:#f4d59b;
}

.bar{
  width:180px;
  height:9px;
  background:#25272b;
  border-radius:99px;
  overflow:hidden;
  margin-top:6px;
}

.fill{
  height:100%;
  width:100%;
  transition:width .15s;
}

.hp{background:#c83c35}
.rage{background:#e59b35}

.stat{
  font-size:11px;
  color:#aaa;
  margin-top:5px;
}

#controls{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.pad,.actions{
  position:absolute;
  bottom:22px;
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.pad{
  left:20px;
  align-items:end;
}

.actions{
  right:20px;
  align-items:end;
}

button{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(20,22,26,.72);
  color:white;
  border-radius:18px;
  width:62px;
  height:62px;
  font-size:12px;
  font-weight:800;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
}

button:active{
  transform:scale(.94);
  background:rgba(100,75,45,.85);
}

.big{
  width:74px;
  height:74px;
  border-radius:50%;
}

.attack{
  border-color:#c28b4c;
}

#message{
  position:absolute;
  left:50%;
  top:54%;
  transform:translate(-50%,-50%);
  text-align:center;
  opacity:0;
  transition:.25s;
}

#message.show{
  opacity:1;
}

.title{
  font-size:34px;
  font-weight:900;
  letter-spacing:5px;
  text-shadow:0 4px 25px #000;
}

.sub{
  font-size:13px;
  color:#d5b57d;
  margin-top:8px;
  letter-spacing:2px;
}

#start,#restart{
  position:absolute;
  left:50%;
  top:68%;
  transform:translate(-50%,-50%);
  pointer-events:auto;
  width:210px;
  height:55px;
  border-radius:15px;
  background:rgba(137,92,40,.85);
  border:1px solid #d5a85d;
}

#restart{
  display:none;
}

@media(max-width:700px) and (orientation:portrait){

  #message:after{
    content:" Rotate your phone to landscape";
    display:block;
    margin-top:15px;
    color:#d5b57d;
    font-size:13px;
  }

  .top{
    top:8px;
  }

  .bar{
    width:130px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div class="top">

    <div class="panel">

      <div class="name">ASHEN WARRIOR</div>

      <div class="bar">
        <div id="hp" class="fill hp"></div>
      </div>

      <div class="stat">HEALTH</div>

      <div class="bar">
        <div id="rage" class="fill rage"></div>
      </div>

      <div class="stat">RAGE</div>

    </div>

    <div class="panel" style="text-align:right">

      <div class="name">OLYMPUS</div>

      <div id="score">SCORE 0000</div>

      <div id="enemyStat" class="stat">
        THE ASHEN BEAST
      </div>

    </div>

  </div>

  <div id="message">

    <div class="title">
      ASHES OF OLYMPUS
    </div>

    <div class="sub">
      THE GODS ARE WATCHING
    </div>

  </div>

  <button id="start">
    ENTER OLYMPUS
  </button>

  <button id="restart">
    RISE AGAIN
  </button>

  <div id="controls">

    <div class="pad">

      <button id="left">◀</button>
      <button id="right">▶</button>
      <button id="jump">JUMP</button>

    </div>

    <div class="actions">

      <button id="dodge">
        DODGE
      </button>

      <button id="block">
        BLOCK
      </button>

      <button id="rageBtn" class="big">
        RAGE
      </button>

      <button id="attack" class="big attack">
        STRIKE
      </button>

    </div>

  </div>

</div>

<script>

const c=document.getElementById("game");
const x=c.getContext("2d");

let W,H,dpr;

function resize(){

  dpr=Math.min(devicePixelRatio||1,2);

  W=innerWidth;
  H=innerHeight;

  c.width=W*dpr;
  c.height=H*dpr;

  x.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();


const S={
  started:false,
  over:false,
  t:0,
  score:0,
  shake:0,
  flash:0,
  particles:[],
  keys:{}
};


const p={
  x:.25,
  y:0,
  vx:0,
  vy:0,
  hp:100,
  rage:35,
  face:1,
  ground:true,
  attack:0,
  dodge:0,
  block:false,
  inv:0
};


const e={
  x:.72,
  y:0,
  hp:100,
  max:100,
  vx:0,
  attack:0,
  stun:0,
  hit:0
};


function clamp(a,b,c){
  return Math.max(b,Math.min(c,a));
}


function ground(){
  return H*.78;
}


function particle(px,py,n=8,pow=3){

  for(let i=0;i<n;i++){

    let a=Math.random()*Math.PI*2;
    let s=Math.random()*pow+.5;

    S.particles.push({
      x:px,
      y:py,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s-1,
      life:25+Math.random()*25,
      r:2+Math.random()*3
    });
  }
}
