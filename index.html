<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ASHES OF OLYMPUS — Chapter I</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Georgia,serif;touch-action:none;user-select:none}
button{font:inherit;color:inherit;border:0}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#070504;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#rotate b{font:54px sans-serif;display:block;transform:rotate(90deg);margin-bottom:20px}
#rotate h2{letter-spacing:4px;font-size:28px}
#rotate p{color:#a99b8d;margin-top:10px}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#100d18 0%,#3a2015 48%,#090706 100%)}
#world{position:absolute;inset:0;overflow:hidden}
.skyGlow{position:absolute;width:65vw;height:65vw;right:-8vw;top:-30vw;border-radius:50%;background:radial-gradient(circle,rgba(255,178,92,.20),transparent 65%)}
.moon{position:absolute;width:90px;height:90px;right:12%;top:11%;border-radius:50%;background:#e5d6ba;box-shadow:0 0 55px rgba(255,215,160,.3)}
.mountain{position:absolute;bottom:20%;width:0;height:0;border-left:20vw solid transparent;border-right:20vw solid transparent;border-bottom:34vh solid #171015;filter:drop-shadow(0 10px 15px #000)}
.m1{left:-12vw}.m2{left:25vw;transform:scale(1.25)}.m3{right:-15vw;transform:scale(1.1)}
.ruin{position:absolute;bottom:19%;width:20px;background:#241b1b;box-shadow:8px -4px 0 #312421,16px 5px 0 #1b1415}
.r1{left:12%;height:30%;transform:rotate(-3deg)}.r2{left:25%;height:21%;transform:rotate(4deg)}.r3{right:18%;height:27%;transform:rotate(-5deg)}
.column{position:absolute;bottom:18%;width:42px;height:29%;background:linear-gradient(90deg,#211a1a,#54423a,#1b1515);border-radius:3px}
.c1{left:43%}.c2{right:31%;height:22%}
.fire{position:absolute;bottom:19%;width:12px;height:25px;border-radius:50% 50% 45% 45%;background:#ffb13b;box-shadow:0 0 25px #ff6a00;animation:flicker .18s infinite alternate}
.f1{left:37%}.f2{right:23%}
@keyframes flicker{to{transform:scaleY(.75) translateX(2px);filter:brightness(1.35)}}
.ground{position:absolute;left:-5%;right:-5%;bottom:-5%;height:28%;background:linear-gradient(#211711,#090807 55%);transform:skewX(-4deg);border-top:2px solid #5a3824}
.path{position:absolute;left:38%;bottom:0;width:38%;height:27%;background:linear-gradient(90deg,transparent,#332117,transparent);transform:perspective(500px) rotateX(58deg)}
.ash{position:absolute;width:3px;height:3px;border-radius:50%;background:#d1c4b7;opacity:.55;animation:fall linear forwards}
@keyframes fall{to{transform:translate(80px,105vh);opacity:0}}

#intro{position:absolute;inset:0;z-index:50;background:linear-gradient(90deg,rgba(3,2,2,.92),rgba(3,2,2,.55)),url("");display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#intro .eyebrow{letter-spacing:6px;color:#c38b54;font-size:12px;margin-bottom:13px}
#intro h1{font-size:clamp(38px,8vw,82px);letter-spacing:8px;text-shadow:0 5px 35px #000}
#intro p{margin:14px 0 28px;color:#c1b4a8;letter-spacing:2px}
.primary{padding:15px 28px;border:1px solid #b27a48;background:rgba(54,29,15,.8);border-radius:5px;letter-spacing:3px;font-weight:bold;box-shadow:0 0 25px rgba(255,115,20,.12)}
.primary:active{transform:scale(.96)}

#hud{position:absolute;z-index:20;top:16px;left:18px;right:18px;display:none;justify-content:space-between}
.hudbox{min-width:210px}
.label{font:11px Arial,sans-serif;letter-spacing:2px;color:#b9aa9d}
.bar{height:10px;background:#201717;border:1px solid #5a3a2b;margin:5px 0 7px}
.fill{height:100%;transition:width .2s}.hp{background:#a83228}.rage{background:#d07a25}
#score{font:12px Arial,sans-serif;letter-spacing:2px;color:#d7c2ad;text-align:right}

#hero{position:absolute;z-index:12;left:27%;bottom:20%;width:150px;height:205px;transition:left .08s;filter:drop-shadow(0 12px 8px rgba(0,0,0,.55))}
.heroShadow{position:absolute;bottom:-3px;left:25px;width:105px;height:16px;border-radius:50%;background:rgba(0,0,0,.68);filter:blur(5px)}
.heroArt{position:absolute;left:0;bottom:0;width:150px;height:205px;overflow:visible}
.heroBody{transform-origin:75px 185px}
#hero.attack .heroWeapon{animation:swordSwing .28s ease-out}
#hero.attack .heroBody{animation:bodyStrike .28s ease-out}
#hero.dodge .heroBody{animation:heroDodge .42s ease-out}
#hero.jump .heroBody{animation:heroJump .48s ease-out}
@keyframes swordSwing{50%{transform:rotate(-52deg) translate(-4px,4px)}}
@keyframes bodyStrike{50%{transform:translateX(7px) rotate(2deg)}}
@keyframes heroDodge{50%{transform:translate(55px,-18px) rotate(-10deg);opacity:.78}}
@keyframes heroJump{50%{transform:translateY(-20px)}}
.heroWeapon{transform-origin:17px 105px}
#enemy{position:absolute;z-index:11;right:21%;bottom:22%;width:125px;height:150px;transition:right .1s}
.eGlow{position:absolute;inset:15px 10px 0;border-radius:50%;background:radial-gradient(circle,rgba(190,55,24,.24),transparent 65%);filter:blur(8px)}
.eHead{position:absolute;left:39px;top:8px;width:48px;height:48px;border-radius:50%;background:#381310;box-shadow:0 0 22px #8d2a1c}
.eye{position:absolute;top:20px;width:8px;height:5px;background:#ffbd3b;box-shadow:0 0 9px #ff6800}.e1{left:9px}.e2{right:9px}
.eBody{position:absolute;left:31px;top:51px;width:63px;height:82px;border-radius:35px 35px 15px 15px;background:linear-gradient(90deg,#160b0b,#612018,#1b0b0b)}
.claw{position:absolute;top:69px;width:20px;height:70px;background:#2b0e0b;border-radius:15px}.cl1{left:13px;transform:rotate(28deg)}.cl2{right:11px;transform:rotate(-28deg)}
#enemy.hit{animation:enemyHit .24s}@keyframes enemyHit{50%{transform:translateX(18px);filter:brightness(2)}}

#boss{position:absolute;z-index:18;top:24%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .5s}
#boss strong{font-size:clamp(22px,5vw,48px);letter-spacing:5px;text-shadow:0 0 25px #e34c20}
#boss small{display:block;color:#c39c80;letter-spacing:3px;margin-top:6px}
#dialogue{position:absolute;z-index:25;left:50%;bottom:30%;transform:translateX(-50%);width:min(680px,72%);padding:13px 18px;background:rgba(7,5,4,.88);border:1px solid #65442d;text-align:center;display:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#dialogue span{color:#dfc8af;font-size:14px;line-height:1.45}

#controls{position:absolute;z-index:30;inset:0;display:none;pointer-events:none}
.pad{position:absolute;left:3.5%;bottom:6%;width:145px;height:110px;display:flex;gap:12px;align-items:end;pointer-events:auto}
.btn{width:60px;height:60px;border-radius:50%;background:rgba(17,13,12,.72);border:1px solid rgba(213,176,136,.38);box-shadow:0 5px 18px rgba(0,0,0,.45),inset 0 0 15px rgba(255,255,255,.05);font:bold 11px Arial;letter-spacing:1px}
.btn:active{transform:scale(.9);background:rgba(112,58,30,.9)}
#rightControls{position:absolute;right:3%;bottom:4%;width:245px;height:155px;pointer-events:auto}
.action{position:absolute}.strike{right:0;bottom:28px;width:78px;height:78px;background:rgba(111,39,22,.78);border-color:#bd7045}.dodge{left:20px;bottom:4px}.jump{left:74px;bottom:70px}.rageBtn{right:88px;top:0;color:#ffb25d;border-color:#b46c30}
.cool{opacity:.45}

#gameover{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(0,0,0,.86)}
#gameover h2{font-size:clamp(40px,8vw,70px);letter-spacing:7px}.muted{color:#a99c92;margin:12px 0 24px}

@media (orientation:portrait){#game{display:none}#rotate{display:flex}}
@media (max-height:520px){#hero{transform:scale(.82);transform-origin:bottom left}.hudbox{min-width:170px}.pad{transform:scale(.8);transform-origin:bottom left}.rightScale{transform:scale(.82);transform-origin:bottom right}}
</style>
</head>
<body>
<div id="rotate"><b>↻</b><h2>ROTATE YOUR PHONE</h2><p>ASHES OF OLYMPUS is played in landscape.</p></div>

<div id="game">
  <div id="world">
    <div class="skyGlow"></div><div class="moon"></div>
    <div class="mountain m1"></div><div class="mountain m2"></div><div class="mountain m3"></div>
    <div class="ruin r1"></div><div class="ruin r2"></div><div class="ruin r3"></div>
    <div class="column c1"></div><div class="column c2"></div>
    <div class="fire f1"></div><div class="fire f2"></div>
    <div class="ground"></div><div class="path"></div>
  </div>

  <div id="intro">
    <div class="eyebrow">CHAPTER I — THE FALL OF OLYMPUS</div>
    <h1>ASHES OF OLYMPUS</h1>
    <p>Even gods can fall. Even ashes can rise.</p>
    <button class="primary" id="start">BEGIN YOUR JOURNEY</button>
  </div>

  <div id="hud">
    <div class="hudbox">
      <div class="label">VITALITY</div><div class="bar"><div id="hp" class="fill hp"></div></div>
      <div class="label">RAGE</div><div class="bar"><div id="rage" class="fill rage"></div></div>
    </div>
    <div id="score">ASHES: 0</div>
  </div>

  <div id="hero">
    <div class="heroShadow"></div>
    <svg class="heroArt" viewBox="0 0 150 205" aria-label="warrior">
      <defs>
        <linearGradient id="skin" x1="0" x2="1"><stop offset="0" stop-color="#5b3326"/><stop offset=".48" stop-color="#a96747"/><stop offset="1" stop-color="#6e3d2d"/></linearGradient>
        <linearGradient id="cloth" x1="0" x2="1"><stop offset="0" stop-color="#15171a"/><stop offset=".5" stop-color="#4b403a"/><stop offset="1" stop-color="#17181b"/></linearGradient>
        <linearGradient id="leather" x1="0" x2="1"><stop offset="0" stop-color="#3a2116"/><stop offset=".5" stop-color="#8a5a31"/><stop offset="1" stop-color="#402516"/></linearGradient>
      </defs>
      <g class="heroBody">
        <path d="M55 142 C53 157 50 174 48 188 L65 188 C68 173 70 158 72 144Z" fill="url(#cloth)" stroke="#100f10" stroke-width="2"/>
        <path d="M78 143 C80 158 84 174 88 188 L105 188 C101 171 99 156 97 141Z" fill="url(#cloth)" stroke="#100f10" stroke-width="2"/>
        <path d="M45 184 L66 184 L72 193 Q72 199 65 200 L40 200 Q36 197 40 191Z" fill="#171313" stroke="#70513d" stroke-width="2"/>
        <path d="M88 184 L106 184 L119 194 Q121 199 113 200 L88 200 Q84 197 88 192Z" fill="#171313" stroke="#70513d" stroke-width="2"/>
        <path d="M48 75 Q75 61 101 76 L103 130 Q94 143 75 145 Q56 143 46 130Z" fill="url(#cloth)" stroke="#7c6658" stroke-width="2"/>
        <path d="M56 82 Q75 91 94 82 L96 111 Q75 119 54 111Z" fill="#282328"/>
        <path d="M49 111 Q75 119 101 111 L101 122 Q75 132 49 122Z" fill="#171619"/>
        <path d="M47 119 Q75 128 102 119 L102 131 Q75 140 47 131Z" fill="url(#leather)"/>
        <rect x="69" y="124" width="13" height="10" rx="2" fill="#c69a55" stroke="#6e4a2b" stroke-width="2"/>
        <path d="M48 79 Q36 78 31 89 L42 102 L55 94Z" fill="#30292a" stroke="#806a5c" stroke-width="2"/>
        <path d="M100 79 Q112 78 118 90 L106 103 L94 94Z" fill="#30292a" stroke="#806a5c" stroke-width="2"/>
        <path d="M38 92 Q31 105 27 119 Q26 125 32 127 Q38 128 41 121 L52 101Z" fill="url(#skin)" stroke="#4a2b22" stroke-width="2"/>
        <path d="M111 92 Q121 101 127 111 Q130 117 125 121 Q120 124 116 118 L99 103Z" fill="url(#skin)" stroke="#4a2b22" stroke-width="2"/>
        <path d="M28 116 L40 111 L44 120 L32 127Z" fill="#9b744a"/>
        <path d="M116 111 L127 108 L130 117 L120 123Z" fill="#9b744a"/>
        <ellipse cx="31" cy="126" rx="7" ry="6" fill="url(#skin)"/>
        <ellipse cx="126" cy="119" rx="7" ry="6" fill="url(#skin)"/>
        <path d="M67 66 L66 78 Q75 84 84 77 L83 66Z" fill="url(#skin)"/>
        <path d="M55 31 Q75 17 95 31 L92 62 Q87 73 75 76 Q63 73 58 62Z" fill="url(#skin)" stroke="#3e261d" stroke-width="2"/>
        <path d="M53 42 Q51 23 69 16 Q87 9 99 28 Q103 37 96 47 L90 38 Q80 29 64 35 L58 48Z" fill="#17110f"/>
        <path d="M58 29 Q51 48 59 61 L51 68 Q43 49 48 31Z" fill="#17110f"/>
        <path d="M88 20 Q100 25 103 39 L96 56 L91 43Z" fill="#17110f"/>
        <path d="M62 49 Q67 46 72 49 M78 49 Q83 46 88 49" fill="none" stroke="#251815" stroke-width="2" stroke-linecap="round"/>
        <circle cx="68" cy="51" r="1.8" fill="#e7c8a0"/><circle cx="83" cy="51" r="1.8" fill="#e7c8a0"/>
        <path d="M75 52 L73 60 L78 60" fill="none" stroke="#633c2d" stroke-width="2" stroke-linecap="round"/>
        <path d="M67 65 Q75 70 84 64" fill="none" stroke="#3c201b" stroke-width="2" stroke-linecap="round"/>
        <path d="M87 55 L82 63" stroke="#c07b57" stroke-width="2" stroke-linecap="round"/>
        <path d="M53 77 Q75 88 98 77 L105 96 Q75 106 46 96Z" fill="#1d1a1c" opacity=".95"/>
        <g class="heroWeapon">
          <path d="M112 102 L137 38 L142 40 L119 106Z" fill="#d8c8a8" stroke="#6c5946" stroke-width="2"/>
          <path d="M116 105 L132 66" stroke="#fff1cc" stroke-width="2" opacity=".55"/>
          <path d="M109 105 L125 111" stroke="#b7834e" stroke-width="7" stroke-linecap="round"/>
          <path d="M105 102 L123 108" stroke="#171313" stroke-width="4" stroke-linecap="round"/>
          <path d="M137 38 L144 25 L145 42Z" fill="#efe1bf"/>
        </g>
      </g>
    </svg>
  </div>

  <div id="enemy"><div class="eGlow"></div><div class="eHead"><i class="eye e1"></i><i class="eye e2"></i></div><div class="eBody"></div><div class="claw cl1"></div><div class="claw cl2"></div></div>

  <div id="boss"><strong>THE ASHEN BEAST</strong><small>GUARDIAN OF THE BROKEN GATE</small></div>
  <div id="dialogue"><span id="dialogueText"></span></div>

  <div id="controls">
    <div class="pad">
      <button class="btn" data-action="left">◀ LEFT</button>
      <button class="btn" data-action="right">RIGHT ▶</button>
    </div>
    <div id="rightControls" class="rightScale">
      <button class="btn action rageBtn" data-action="rage">RAGE</button>
      <button class="btn action jump" data-action="jump">JUMP</button>
      <button class="btn action dodge" data-action="dodge">DODGE</button>
      <button class="btn action strike" data-action="attack">STRIKE</button>
    </div>
  </div>

  <div id="gameover">
    <h2>YOU FELL</h2><div class="muted">The ashes remember every warrior.</div>
    <button class="primary" id="restart">RISE AGAIN</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let playing=false,x=27,health=100,rage=0,score=0,enemyHealth=100,lastAttack=0,lastEnemy=0,jumping=false;

function update(){
  $("hero").style.left=x+"%";
  $("hp").style.width=health+"%";
  $("rage").style.width=rage+"%";
  $("score").textContent="ASHES: "+score;
}
function say(t,ms=2800){
  $("dialogueText").textContent=t;$("dialogue").style.display="block";
  clearTimeout(say.timer);say.timer=setTimeout(()=>$("dialogue").style.display="none",ms);
}
function move(d){if(!playing)return;x=Math.max(6,Math.min(74,x+d*2.3));update()}
function attack(){
  if(!playing||Date.now()-lastAttack<420)return;lastAttack=Date.now();
  $("hero").classList.remove("attack");void $("hero").offsetWidth;$("hero").classList.add("attack");
  const dist=Math.abs(x-68);
  if(dist<18){
    enemyHealth-=20;rage=Math.min(100,rage+16);score+=10;
    $("enemy").classList.add("hit");setTimeout(()=>$("enemy").classList.remove("hit"),240);
    if(enemyHealth<=0){enemyHealth=100;score+=120;say("Warrior: That was your big entrance?");$("boss").style.opacity="1";setTimeout(()=>$("boss").style.opacity="0",1000)}
  }
  update()
}
function dodge(){
  if(!playing)return;
  $("hero").classList.remove("dodge");void $("hero").offsetWidth;$("hero").classList.add("dodge");
}
function jump(){
  if(!playing||jumping)return;jumping=true;
  $("hero").classList.remove("jump");void $("hero").offsetWidth;$("hero").classList.add("jump");
  $("hero").style.bottom="24%";
  setTimeout(()=>$("hero").style.bottom="20%",480);
  setTimeout(()=>jumping=false,500);
}
function rageAttack(){
  if(!playing||rage<100)return;
  rage=0;enemyHealth-=60;score+=80;say("THE ASHES AWAKEN.",1500);
  $("enemy").style.filter="brightness(2.5)";
  setTimeout(()=>$("enemy").style.filter="",300);
  if(enemyHealth<=0){enemyHealth=100;score+=250;say("Warrior: I was saving that one.",2200)}
  update()
}
function enemyAttack(){
  if(!playing||Math.abs(x-68)>18||Date.now()-lastEnemy<1000)return;
  lastEnemy=Date.now();health-=8;rage=Math.min(100,rage+7);
  if(health<=0){health=0;playing=false;$("controls").style.display="none";$("gameover").style.display="flex"}
  update()
}
document.querySelectorAll("[data-action]").forEach(b=>{
  const a=b.dataset.action;
  const run=()=>({left:()=>move(-1),right:()=>move(1),attack,dodge,jump,rage:rageAttack}[a]());
  b.addEventListener("pointerdown",e=>{e.preventDefault();run()});
});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-1);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(1);
  if(e.key===" "||e.key.toLowerCase()==="j")attack();
  if(e.key.toLowerCase()==="k")dodge();
  if(e.key.toLowerCase()==="w")jump();
  if(e.key.toLowerCase()==="l")rageAttack();
});
async function requestLandscape(){
  try{
    if(document.documentElement.requestFullscreen && !document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }
  }catch(e){}
  try{
    if(screen.orientation?.lock){
      await screen.orientation.lock("landscape");
    }
  }catch(e){}
}
$("start").onclick=async()=>{
  await requestLandscape();
  $("intro").style.display="none";$("hud").style.display="flex";$("controls").style.display="block";playing=true;
  say("Warrior: Olympus is burning... and somehow I'm still alive.",3400);
  setTimeout(()=>say("Voice in the darkness: Then perhaps the gods made one mistake.",3400),3700);
  setTimeout(()=>say("Warrior: Great. A mysterious voice. Exactly what I needed.",2600),7300);
};
$("restart").onclick=()=>{
  health=100;rage=0;score=0;enemyHealth=100;x=27;playing=true;
  $("gameover").style.display="none";$("controls").style.display="block";update();say("Warrior: Again? Fine. Let's make it interesting.",2400)
};
function ash(){
  if(!playing)return;
  const a=document.createElement("i");a.className="ash";a.style.left=Math.random()*100+"vw";a.style.top="-5px";a.style.animationDuration=(3+Math.random()*5)+"s";
  $("game").appendChild(a);setTimeout(()=>a.remove(),9000)
}
setInterval(ash,260);setInterval(enemyAttack,180);update();
try{screen.orientation?.lock?.("landscape")}catch(e){}
</script>
</body>
</html>
